<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kalo Workout Receiver</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #kal {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: 110px;
      height: 126px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
      animation: kaljump 0.8s ease-in-out infinite;
    }
    @keyframes kaljump {
      0%, 100% { transform: translateY(0) scale(1); }
      30%      { transform: translateY(-22px) scale(1.04); }
      55%      { transform: translateY(0) scale(0.98); }
      75%      { transform: translateY(-8px) scale(1.01); }
    }
    #idle {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #888; font-family: sans-serif; font-size: 28px;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <img id="kal" src="kal_s00.png" alt="Kal">
  <div id="idle">Kalo Workout Receiver - waiting for a video...</div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var NAMESPACE = 'urn:x-cast:com.billywhizz17a.kalo';
    var ytPlayer = null;
    var pendingVideoId = null;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: function () {
            document.getElementById('idle').style.display = 'none';
            if (pendingVideoId) {
              ytPlayer.loadVideo(pendingVideoId, 0);
              pendingVideoId = null;
            }
          }
        }
      });
    }

    function handleMessage(data) {
      try {
        var msg = JSON.parse(data);
        if (msg.videoId) {
          if (ytPlayer && ytPlayer.loadVideo) {
            ytPlayer.loadVideo(msg.videoId, 0);
          } else {
            pendingVideoId = msg.videoId;
          }
        }
        if (msg.stage != null) {
          var stage = Math.max(0, Math.min(11, parseInt(msg.stage, 10) || 0));
          document.getElementById('kal').src = 'kal_s' +
            (stage < 10 ? '0' : '') + stage + '.png';
        }
      } catch (e) {
        // ignore malformed messages
      }
    }

    window.onload = function () {
      if (window.cast && cast.framework) {
        var ctx = cast.framework.CastReceiverContext.getInstance();
        ctx.setMessageHandler(NAMESPACE, function (event) {
          handleMessage(event.data);
        });
        ctx.start();
      }
    };
  </script>
</body>
</html>
